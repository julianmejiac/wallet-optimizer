<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Wallet Optimizer - Budgeting Tool</title> <!--This is the title -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Budgeting Tool</h1> <!--This is a BLOCK ELEMENT, the page title-->
    <!-- Budget input-->
    <label for="category"> Category:</label>
    <input type="text" id="category">

    <label for="monthlyAmount">  Monthly Amount:</label>
    <input type="number" id="monthlyAmount" step="0.01">

    <button type="button" id="addExpenseButton"> Add Expense</button>
    <!--Table of expenses-->
    <h2>Monthly Expenses</h2>
    <table>
        <thead>
            <tr><!--table row-->
                <th>Category</th> <!--table header cell-->
                <th>Monthly Amount</th>
                <th> Action</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody">

        </tbody>
    </table>
    <button type="button" id="recommendButton">
        Get Recommendations
    </button>
    <!--Recommendation table will eventually appear here-->
    <div id="recommendationResults">
        <h2> Recommendations</h2>
        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Monthly Amount</th>
                    <th>Best Card</th>
                    <th>Cashback %</th>
                    <th>Monthly Reward</th>

                </tr>
            </thead>
            <tbody id="recommendationTableBody">

            </tbody>
        </table>
        <div id="totals">
            <p id="totalMonthlyExpenses"></p>
            <p id="totalMonthlyRewards"></p>
            <p id="totalAnnualRewards"></p>


        </div>
    </div>
    <script src="config.js"></script>
    <script src="budget.js"></script>
</body>




</html>
